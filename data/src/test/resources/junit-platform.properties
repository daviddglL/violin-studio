# Red de seguridad: un test colgado (hilos reales, fakes bloqueantes) falla en 60 s en vez de agotar los 45 min del CI.
# SEPARATE_THREAD: un runBlocking esperando a un hilo bloqueado no atiende la interrupcion del modo por defecto.
junit.jupiter.execution.timeout.default = 60s
junit.jupiter.execution.timeout.thread.mode.default = SEPARATE_THREAD
