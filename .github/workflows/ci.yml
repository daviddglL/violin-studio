name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Qué lado del repo ha cambiado: la app Android (raíz, Gradle) o el backend de Firebase (backend/).
  # Un cambio solo de backend no publica build para testers; uno solo de docs no ejecuta nada salvo secrets-guard.
  cambios:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.filtro.outputs.app }}
      backend: ${{ steps.filtro.outputs.backend }}
      ci: ${{ steps.filtro.outputs.ci }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filtro
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            app:
              - 'app/**'
              - 'ui/**'
              - 'domain/**'
              - 'data/**'
              - 'build-logic/**'
              - 'gradle/**'
              - '*.gradle.kts'
              - 'gradle.properties'
              - 'gradlew*'
              - 'fastlane/**'
              - 'Gemfile*'
            backend:
              - 'backend/**'
            ci:
              - '.github/workflows/**'

  secrets-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/test-secrets-guard.sh
      - run: bash scripts/secrets-guard.sh

  # Tambien corre con cambios de backend: los tests de paridad de domain/data leen backend/.
  android:
    needs: cambios
    if: needs.cambios.outputs.app == 'true' || needs.cambios.outputs.backend == 'true' || needs.cambios.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: google-services.json
        env:
          GS_DEV: ${{ secrets.GOOGLE_SERVICES_DEV_BASE64 }}
          GS_PROD: ${{ secrets.GOOGLE_SERVICES_PROD_BASE64 }}
        run: |
          bash scripts/ci-google-services.sh
      - run: ./gradlew check coverage assembleDevDebug --continue -Proborazzi.test.verify=true
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-reports
          path: |
            **/build/reports/
            **/build/outputs/roborazzi/

  functions:
    needs: cambios
    if: needs.cambios.outputs.backend == 'true' || needs.cambios.outputs.ci == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22", cache: npm, cache-dependency-path: backend/functions/package-lock.json }
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with: { distribution: temurin, java-version: "21" }
      - run: npm ci --prefix functions
      - run: npm --prefix functions run lint
      - run: npm --prefix functions run build
      - run: npm --prefix functions test
      - run: npm i -g firebase-tools@15.20.0
      # Valor fijo de PRUEBA, no secreto: nunca debe ser un secreto real (el fichero está gitignored y solo vive en el runner).
      - run: echo "GUARDIAN_EMAIL_PEPPER=ci-fixed-non-secret-pepper-0123456789abcdef" > functions/.secret.local
      - run: echo "TEACHER_CODE_PEPPER=ci-fixed-non-secret-code-pepper-0123456789abcdef" >> functions/.secret.local
      - run: firebase emulators:exec --only functions,auth,firestore,storage,hosting --project demo-violin-studio "npm --prefix functions run test:integration"

  rules:
    needs: cambios
    if: needs.cambios.outputs.backend == 'true' || needs.cambios.outputs.ci == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22", cache: npm, cache-dependency-path: backend/rules-tests/package-lock.json }
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with: { distribution: temurin, java-version: "21" }
      - run: npm ci --prefix rules-tests
      - run: npm i -g firebase-tools@15.20.0
      - run: firebase emulators:exec --only firestore,storage --project demo-violin-studio "npm --prefix rules-tests test"

  # E2E contra los emuladores de Firebase (functions, auth, firestore, storage). Bloqueante: cubre registro, menor,
  # vinculo profesor-alumno, chat y subida de grabaciones de audio y video.
  e2e:
    needs: cambios
    if: >-
      github.event_name == 'pull_request' &&
      (needs.cambios.outputs.app == 'true' || needs.cambios.outputs.backend == 'true' || needs.cambios.outputs.ci == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22" }
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: google-services.json
        env:
          GS_DEV: ${{ secrets.GOOGLE_SERVICES_DEV_BASE64 }}
          GS_PROD: ${{ secrets.GOOGLE_SERVICES_PROD_BASE64 }}
        run: |
          bash scripts/ci-google-services.sh
          # Sin credenciales el emulador de Functions asume el bucket `<proyecto>.appspot.com` para los triggers de
          # Storage (finalizeRecording); la app subiria al bucket real (`.firebasestorage.app`) y el trigger no saltaria.
          jq '.project_info.storage_bucket = (.project_info.project_id + ".appspot.com")' app/src/dev/google-services.json > gs.tmp
          mv gs.tmp app/src/dev/google-services.json
      - run: npm ci --prefix backend/functions && npm --prefix backend/functions run build
      - run: npm i -g firebase-tools@15.20.0
      # requestGuardianConsent (E2E del menor) necesita el pepper del HMAC; valor fijo de PRUEBA, como en el job functions.
      - run: echo "GUARDIAN_EMAIL_PEPPER=ci-fixed-non-secret-pepper-0123456789abcdef" > backend/functions/.secret.local
      - run: echo "TEACHER_CODE_PEPPER=ci-fixed-non-secret-code-pepper-0123456789abcdef" >> backend/functions/.secret.local
      - name: Arrancar el emulador de Functions
        working-directory: backend
        run: |
          nohup firebase emulators:start --only functions,auth,firestore,storage --project violin-app-dev-f0b55 > ../emulators.log 2>&1 &
          npx --yes wait-on@9 tcp:127.0.0.1:5001 tcp:127.0.0.1:9099 tcp:127.0.0.1:8080 tcp:127.0.0.1:9199 -t 120000
      # El emulador moria al arrancar: "Not enough space to create userdata partition" (5 GB libres, pide 7,3 GB).
      - name: Liberar disco
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          # Imagen ligera (API 30) y emulador por defecto de la accion: el pin 37.1.11 tampoco arrancaba y la API 34
          # google_apis es la mas pesada para 4 vCPU/16 GB compartidos con los emuladores de Firebase y Gradle.
          api-level: 30
          arch: x86_64
          target: google_apis
          # Con la pantalla por defecto (320x640 @160dpi) los controles quedaban fuera de pantalla ("Failed to inject touch input").
          profile: pixel_6
          ram-size: 3072M
          heap-size: 512M
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          disable-animations: true
          emulator-boot-timeout: 900
          script: ./gradlew :app:connectedDevDebugAndroidTest
      - if: failure()
        name: Log de los emuladores
        run: tail -n 300 emulators.log
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: emulators-log, path: emulators.log }

  # El release solo corre si existen los secrets de firma (KEYSTORE_BASE64, STORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD);
  # si falta alguno, el push a main deja un aviso visible en el resumen del run en lugar de fallar.
  release-firma:
    needs: cambios
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.cambios.outputs.app == 'true'
    runs-on: ubuntu-latest
    outputs:
      lista: ${{ steps.comprobar.outputs.lista }}
      play: ${{ steps.comprobar.outputs.play }}
    steps:
      - id: comprobar
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          # La subida a Google Play es opcional: sin el secreto solo se publica en App Distribution.
          if [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "play=true" >> "$GITHUB_OUTPUT"
          else
            echo "play=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Google Play desactivado::Falta el secret PLAY_SERVICE_ACCOUNT_JSON; el AAB no se sube a Play (docs/runbooks/lanzamiento-produccion.md, paso 4)."
          fi
          faltan=""
          for s in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!s}" ] || faltan="$faltan $s"
          done
          if [ -n "$faltan" ]; then
            echo "::warning title=Release desactivado::Faltan los secrets de firma:$faltan. El APK/AAB no se compila ni se publica hasta configurarlos."
            echo "## ⚠️ Release desactivado" >> "$GITHUB_STEP_SUMMARY"
            echo "Faltan los secrets de firma:$faltan." >> "$GITHUB_STEP_SUMMARY"
            echo "lista=false" >> "$GITHUB_OUTPUT"
          else
            echo "lista=true" >> "$GITHUB_OUTPUT"
          fi

  # Solo con cambios de la app. functions y rules pueden saltarse (push solo de app): basta con que no fallen.
  release:
    if: >-
      !cancelled() && !contains(needs.*.result, 'failure') &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.cambios.outputs.app == 'true' && needs.android.result == 'success' &&
      needs.release-firma.outputs.lista == 'true'
    needs: [cambios, secrets-guard, android, functions, rules, release-firma]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYSTORE_PATH: ${{ github.workspace }}/../upload.jks
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: google-services.json y keystore
        env:
          GS_DEV: ${{ secrets.GOOGLE_SERVICES_DEV_BASE64 }}
          GS_PROD: ${{ secrets.GOOGLE_SERVICES_PROD_BASE64 }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          bash scripts/ci-google-services.sh --require
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
      - run: ./gradlew assembleProdRelease bundleProdRelease
      - name: Verificar firma
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs app/build/outputs/apk/prod/release/app-prod-release.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: release-aab, path: app/build/outputs/bundle/prodRelease/ }
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with: { ruby-version: "3.3" }
      - run: bundle install
      - name: Publicar en App Distribution
        env:
          FIREBASE_APP_ID_PROD: ${{ vars.FIREBASE_APP_ID_PROD }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          export FIREBASE_SERVICE_ACCOUNT_PATH="$RUNNER_TEMP/sa.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$FIREBASE_SERVICE_ACCOUNT_PATH"
          bundle exec fastlane android deploy_firebase
      # Pista de pruebas internas de Play: la necesita App Check (Play Integrity solo valida instalaciones desde Play).
      - name: Publicar en Google Play (pruebas internas)
        if: needs.release-firma.outputs.play == 'true'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}
        run: |
          export PLAY_SERVICE_ACCOUNT_PATH="$RUNNER_TEMP/play.json"
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$PLAY_SERVICE_ACCOUNT_PATH"
          bundle exec fastlane android deploy_play
