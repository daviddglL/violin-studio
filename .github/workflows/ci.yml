name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  secrets-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test-secrets-guard.sh
      - run: bash scripts/secrets-guard.sh

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - name: google-services.json
        env:
          GS_DEV: ${{ secrets.GOOGLE_SERVICES_DEV_BASE64 }}
          GS_PROD: ${{ secrets.GOOGLE_SERVICES_PROD_BASE64 }}
        run: |
          mkdir -p app/src/dev app/src/prod
          echo "$GS_DEV" | base64 -d > app/src/dev/google-services.json
          echo "$GS_PROD" | base64 -d > app/src/prod/google-services.json
      - run: ./gradlew check coverage assembleDevDebug --continue -Proborazzi.test.verify=true
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            **/build/reports/
            **/build/outputs/roborazzi/

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: functions/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - run: npm ci --prefix functions
      - run: npm --prefix functions run lint
      - run: npm --prefix functions run build
      - run: npm --prefix functions test
      - run: npm i -g firebase-tools@15.20.0
      # Valor fijo de PRUEBA, no secreto: nunca debe ser un secreto real (el fichero está gitignored y solo vive en el runner).
      - run: echo "GUARDIAN_EMAIL_PEPPER=ci-fixed-non-secret-pepper-0123456789abcdef" > functions/.secret.local
      - run: firebase emulators:exec --only functions,auth,firestore,storage,hosting --project demo-violin-studio "npm --prefix functions run test:integration"

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: rules-tests/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - run: npm ci --prefix rules-tests
      - run: npm i -g firebase-tools@15.20.0
      - run: firebase emulators:exec --only firestore,storage --project demo-violin-studio "npm --prefix rules-tests test"

  # E2E contra los emuladores de Firebase (functions, auth, firestore, storage). NO bloqueante (continue-on-error): el
  # emulador de Android en el runner ha sido inestable; pasa a bloquear cuando lleve varias ejecuciones verdes.
  e2e:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 45
    continue-on-error: true # pasa a bloquear cuando sea estable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: gradle/actions/setup-gradle@v4
      - name: google-services.json
        env:
          GS_DEV: ${{ secrets.GOOGLE_SERVICES_DEV_BASE64 }}
          GS_PROD: ${{ secrets.GOOGLE_SERVICES_PROD_BASE64 }}
        run: |
          mkdir -p app/src/dev app/src/prod
          echo "$GS_DEV" | base64 -d > app/src/dev/google-services.json
          echo "$GS_PROD" | base64 -d > app/src/prod/google-services.json
      - run: npm ci --prefix functions && npm --prefix functions run build
      - run: npm i -g firebase-tools@15.20.0
      # requestGuardianConsent (E2E del menor) necesita el pepper del HMAC; valor fijo de PRUEBA, como en el job functions.
      - run: echo "GUARDIAN_EMAIL_PEPPER=ci-fixed-non-secret-pepper-0123456789abcdef" > functions/.secret.local
      - name: Arrancar el emulador de Functions
        run: |
          nohup firebase emulators:start --only functions,auth,firestore,storage --project violin-app-dev-f0b55 > emulators.log 2>&1 &
          npx --yes wait-on@9 tcp:127.0.0.1:5001 tcp:127.0.0.1:9099 tcp:127.0.0.1:8080 tcp:127.0.0.1:9199 -t 120000
      # El emulador moria al arrancar: "Not enough space to create userdata partition" (5 GB libres, pide 7,3 GB).
      - name: Liberar disco
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          # Imagen ligera (API 30) y emulador por defecto de la accion: el pin 37.1.11 tampoco arrancaba y la API 34
          # google_apis es la mas pesada para 4 vCPU/16 GB compartidos con los emuladores de Firebase y Gradle.
          api-level: 30
          arch: x86_64
          target: google_apis
          # Con la pantalla por defecto (320x640 @160dpi) los controles quedaban fuera de pantalla ("Failed to inject touch input").
          profile: pixel_6
          ram-size: 3072M
          heap-size: 512M
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          disable-animations: true
          emulator-boot-timeout: 900
          script: ./gradlew :app:connectedDevDebugAndroidTest
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: emulators-log, path: emulators.log }

  # PENDIENTE: el release está desactivado mientras no existan los secrets de firma
  # (KEYSTORE_BASE64, STORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD). Cada push a main deja
  # un aviso visible en el resumen del run hasta que se configuren.
  release-firma:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      lista: ${{ steps.comprobar.outputs.lista }}
    steps:
      - id: comprobar
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          faltan=""
          for s in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!s}" ] || faltan="$faltan $s"
          done
          if [ -n "$faltan" ]; then
            echo "::warning title=Release desactivado::Faltan los secrets de firma:$faltan. El APK/AAB no se compila ni se publica hasta configurarlos."
            echo "## ⚠️ Release desactivado" >> "$GITHUB_STEP_SUMMARY"
            echo "Faltan los secrets de firma:$faltan." >> "$GITHUB_STEP_SUMMARY"
            echo "lista=false" >> "$GITHUB_OUTPUT"
          else
            echo "lista=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release-firma.outputs.lista == 'true'
    needs: [secrets-guard, android, functions, rules, release-firma]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYSTORE_PATH: ${{ github.workspace }}/../upload.jks
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - name: google-services.json y keystore
        env:
          GS_DEV: ${{ secrets.GOOGLE_SERVICES_DEV_BASE64 }}
          GS_PROD: ${{ secrets.GOOGLE_SERVICES_PROD_BASE64 }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p app/src/dev app/src/prod
          echo "$GS_DEV" | base64 -d > app/src/dev/google-services.json
          echo "$GS_PROD" | base64 -d > app/src/prod/google-services.json
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
      - run: ./gradlew assembleProdRelease bundleProdRelease
      - name: Verificar firma
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs app/build/outputs/apk/prod/release/app-prod-release.apk
      - uses: actions/upload-artifact@v4
        with: { name: release-aab, path: app/build/outputs/bundle/prodRelease/ }
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: "3.3" }
      - run: bundle install
      - name: Publicar en App Distribution
        env:
          FIREBASE_APP_ID_PROD: ${{ vars.FIREBASE_APP_ID_PROD }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          export FIREBASE_SERVICE_ACCOUNT_PATH="$RUNNER_TEMP/sa.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$FIREBASE_SERVICE_ACCOUNT_PATH"
          bundle exec fastlane android deploy_firebase
